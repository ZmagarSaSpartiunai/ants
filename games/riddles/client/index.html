<!doctype html>
<html lang="uk">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<meta name="theme-color" content="#e8f2df">
<meta name="robots" content="noindex, nofollow">
<title>Хто це?</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Ctext y='26' font-size='26'%3E%E2%9D%93%3C/text%3E%3C/svg%3E">
</head>
<body>
<main>
  <div class="bar">
    <a class="round back" href="/">←</a>
    <div class="dots" id="dots"></div>
    <button id="ask" class="round" type="button" title="Повторити запитання">🔈</button>
    <button id="sound" class="round" type="button" title="Звук">🔊</button>
  </div>
  <div class="board" id="board"></div>

  <div id="start" class="panel">
    <p class="title">Хто це?</p>
    <p class="sub">Слухай запитання і торкнись правильної картинки.</p>
    <button id="play" type="button">Грати</button>
  </div>
  <div id="done" class="panel" hidden>
    <p class="face">🎉</p>
    <p class="title">Молодець!</p>
    <p class="sub" id="doneSub"></p>
    <button id="again" type="button">Ще раз</button>
  </div>
</main>
<script type="module" src="/src/main.ts"></script>
</body>
</html>
