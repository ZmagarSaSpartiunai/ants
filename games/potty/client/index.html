<!doctype html>
<html lang="uk">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<meta name="theme-color" content="#bfe4f2">
<meta name="robots" content="noindex, nofollow">
<title>На горщик!</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Ctext y='26' font-size='26'%3E%F0%9F%9A%BD%3C/text%3E%3C/svg%3E">
</head>
<body>
<main>
  <div class="stage">
    <canvas id="field"></canvas>
    <div id="start" class="start">
      <p class="title">На горщик!</p>
      <p class="sub">Хтось запросився — підстав горщик.<br>Повний — неси його до унітаза.</p>
      <button id="play" type="button">Грати</button>
    </div>
    <div id="done" class="start" hidden>
      <p class="face" id="doneFace"></p>
      <p class="title" id="doneTitle"></p>
      <p class="sub" id="doneSub"></p>
      <button id="again" type="button">Ще раз</button>
    </div>
    <button id="sound" class="sound" type="button" title="Звук">🔊</button>
    <a class="back" href="/">← інші ігри</a>
  </div>
</main>
<script type="module" src="/src/main.ts"></script>
</body>
</html>
